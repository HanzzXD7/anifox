
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050407">

<title>AniFoX</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #050407;
  color: white;
  font-family: Arial, sans-serif;
  min-height: 100vh;
  overflow: hidden;
}

/* SPLASH SCREEN */
#splash {
  position: fixed;
  inset: 0;
  background: #050407;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 10;
  transition: opacity .7s ease;
}

/* LOGO */
.logo {
  font-size: 43px;
  font-weight: 900;
  letter-spacing: -2px;
  font-style: italic;
  color: #f4eaff;
  text-shadow: 0 0 15px #a855f7,
               0 0 35px #7e22ce;
  animation: logoPulse 2s ease-in-out infinite;
}

.logo span {
  color: #a855f7;
}

/* LOADING SPINNER */
.spinner {
  width: 48px;
  height: 48px;
  border: 4px solid #261337;
  border-top-color: #c084fc;
  border-radius: 50%;
  margin-top: 65px;
  box-shadow: 0 0 15px #9333ea55;
  animation: spin .8s linear infinite;
}

/* PROGRESS */
.progress-container {
  width: 70%;
  max-width: 330px;
  margin-top: 42px;
}

.progress-bar {
  height: 9px;
  background: #17101e;
  border: 1px solid #7629bd;
  border-radius: 30px;
  overflow: hidden;
  box-shadow: 0 0 12px #9333ea33;
}

.progress-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(
    90deg,
    #7024d8,
    #bc55ff,
    #e4baff
  );
  border-radius: 30px;
  box-shadow: 0 0 15px #b44cff;
  transition: width .15s linear;
}

.percentage {
  text-align: center;
  color: #c084fc;
  font-size: 19px;
  margin-top: 18px;
  letter-spacing: 2px;
}

/* VERSION */
.version {
  position: absolute;
  bottom: 45px;
  color: #9874b5;
  font-size: 12px;
  letter-spacing: 4px;
}

.version::before,
.version::after {
  content: "";
  display: inline-block;
  width: 35px;
  height: 1px;
  background: #7934a9;
  vertical-align: middle;
  margin: 0 13px;
}

/* ANIMATIONS */
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

@keyframes logoPulse {
  50% {
    text-shadow: 0 0 25px #a855f7,
                 0 0 45px #9333ea;
  }
}

/* HOMEPAGE PLACEHOLDER */
#home {
  display: none;
  min-height: 100vh;
  padding: 30px 20px;
  background: #0b0711;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<!-- SPLASH SCREEN -->
<div id="splash">

  <div class="logo">
    Ani<span>FoX</span>
  </div>

  <div class="spinner"></div>

  <div class="progress-container">
    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>

    <div class="percentage" id="percentage">
      0%
    </div>
  </div>

  <div class="version">v1.0.0</div>

</div>

<!-- HOMEPAGE -->
<main id="home">
  <h1>AniFoX</h1>
  <p>Welcome to AniFoX.</p>
</main>

<script>
let progress = 0;

const bar = document.getElementById("progress");
const percentage = document.getElementById("percentage");

const loading = setInterval(() => {

  progress += Math.floor(Math.random() * 4) + 1;

  if (progress >= 100) {
    progress = 100;
    clearInterval(loading);

    setTimeout(() => {
      const splash = document.getElementById("splash");

      splash.style.opacity = "0";

      setTimeout(() => {
        splash.style.display = "none";
        document.getElementById("home").style.display = "block";
        document.body.style.overflow = "auto";
      }, 700);

    }, 300);
  }

  bar.style.width = progress + "%";
  percentage.textContent = progress + "%";

}, 75);
</script>

</body>
</html>
