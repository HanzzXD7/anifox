<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d0618" />
  <title>AniFoX</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="splash" class="splash">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="splash-content">
      <!-- LOGO ANIFOX -->
      <img src="logo.png" alt="AniFoX Logo" class="splash-logo" />
      
      <div class="liquid-spinner"></div>
      <p class="splash-text">Menyiapkan pengalaman menonton...</p>

      <div id="auth-actions" class="auth-actions hidden">
        <button class="btn-google" id="btn-google">
          <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.1 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.1-4.1 5.6l6.2 5.2C36.9 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
          Login with Google
        </button>
        <button class="btn-skip" id="btn-skip">Lanjutkan tanpa login</button>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app" class="app hidden">

    <!-- PAGE: HOME -->
    <section id="page-home" class="page active">
      <header class="page-header">
        <h2>AniFoX</h2>
        <div class="avatar">AF</div>
      </header>

      <div class="hero glass">
        <img id="hero-img" src="" alt="" />
        <div class="hero-overlay">
          <span class="badge">POPULER</span>
          <h3 id="hero-title">-</h3>
          <button class="btn-primary">Tonton Sekarang</button>
        </div>
      </div>

      <h3 class="section-title">Terbaru</h3>
      <div class="hscroll" id="latest-list"></div>

      <h3 class="section-title">Populer</h3>
      <div class="grid" id="popular-list"></div>
    </section>

    <!-- PAGE: SEARCH -->
    <section id="page-search" class="page">
      <header class="page-header"><h2>Cari Anime</h2></header>
      <div class="search-bar glass">
        <input type="text" id="search-input" placeholder="Ketik judul anime..." />
      </div>
      <div class="grid" id="search-results"></div>
    </section>

    <!-- PAGE: MY LIST -->
    <section id="page-list" class="page">
      <header class="page-header"><h2>Daftar Saya</h2></header>
      <div class="empty-state glass">
        <p>Daftar tontonan Anda masih kosong</p>
        <span>Tandai anime favorit untuk ditonton nanti</span>
      </div>
    </section>

    <!-- PAGE: DETAIL ANIME -->
    <section id="page-detail" class="page detail-page">
      <button class="back-btn glass" onclick="closeDetail()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="detail-hero">
        <img id="detail-img" src="" alt="" />
        <div class="detail-fade"></div>
      </div>
      <div class="detail-content glass">
        <h2 id="detail-title">-</h2>
        <div class="chips">
          <span class="chip" id="detail-rating">Rating -</span>
          <span class="chip" id="detail-status">-</span>
          <span class="chip" id="detail-episodes">- eps</span>
        </div>
        <p id="detail-synopsis">-</p>
        <h3 class="section-title">Episode</h3>
        <div class="episode-grid" id="detail-episodes-list"></div>
      </div>
    </section>

    <!-- PAGE: PLAYER -->
    <section id="page-player" class="page player-page">
      <button class="back-btn glass" onclick="closePlayer()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="video-wrap glass">
        <div class="video-placeholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>
          <p id="player-title">Judul Episode</p>
        </div>
      </div>
      <div class="player-info glass">
        <h3 id="player-anime">-</h3>
        <p id="player-episode">Episode -</p>
        <div class="chips">
          <span class="chip active">Server 1</span>
          <span class="chip">Server 2</span>
          <span class="chip">Server 3</span>
        </div>
        <div class="ep-nav">
          <button class="btn-ghost">Prev</button>
          <button class="btn-ghost">Next</button>
        </div>
      </div>
    </section>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav glass">
      <button class="nav-item active" data-page="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9.5z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <small>Home</small>
      </button>
      <button class="nav-item" data-page="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <small>Search</small>
      </button>
      <button class="nav-item" data-page="list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <small>My List</small>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
