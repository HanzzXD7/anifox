
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07152f">
  <title>AniFoX - Player Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #07152f;
      color: white;
      font-family: Arial, sans-serif;
    }

    h1 {
      color: #a78bfa;
    }

    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 14px;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    p {
      color: #b8c4dc;
    }
  </style>
</head>

<body>

  <h1>AniFoX</h1>
  <p>Frieren: Beyond Journey's End</p>
  <p>Episode 1</p>

  <div class="player">
    <iframe
      src="https://player.bilibili.com/player.html?seasonId=2090295&episodeId=12975044&autoplay=0&danmaku=0"
      allowfullscreen
      allow="fullscreen; autoplay">
    </iframe>
  </div>

  <p>Player resmi Bilibili · Pengujian AniFoX</p>

</body>
</html>
